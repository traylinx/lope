name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI Trusted Publisher must match:
    # owner=traylinx, repository=lope, workflow=publish.yml, environment=pypi
    environment:
      name: pypi
      url: https://pypi.org/project/lope-agent/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-test:
    runs-on: ubuntu-latest
    # TestPyPI Trusted Publisher must match:
    # owner=traylinx, repository=lope, workflow=publish.yml, environment=testpypi
    environment:
      name: testpypi
      url: https://test.pypi.org/project/lope-agent/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
