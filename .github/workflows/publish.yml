name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' || vars.TESTPYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify tag and package versions
        run: |
          bash scripts/check-version.sh
          test "$GITHUB_REF_NAME" = "v$(python -c 'from lope import __version__; print(__version__)')"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Qualify actual distribution outside checkout
        run: python scripts/check-package.py dist/*.whl --sdist dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: ${{ vars.PYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Trusted publisher: traylinx/lope, publish.yml, environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/project/lope-agent/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish verified bytes to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1

  publish-test:
    needs: build
    if: ${{ vars.TESTPYPI_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # Separate optional destination, never implied by a production publication.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/lope-agent/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish verified bytes to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
