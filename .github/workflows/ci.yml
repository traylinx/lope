name: CI

# PR/push CI added in the OpenAI-readiness sprint (2026-06). Three gates:
# tests+lint, version-string sync, and a secret scan. Third-party actions are
# pinned by full commit SHA (with a human-readable tag comment) so a moved tag
# can't change what runs; bump pins deliberately.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (dev extra)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint gate — blocking)
        run: ruff check .
      - name: compileall
        run: python -m compileall -q lope tests
      - name: Pytest
        run: python -m pytest -q
      - name: mypy (advisory — does not fail the build, per sprint D2)
        run: mypy lope || true

  version-sync:
    name: version-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: check-version.sh (all 6 version strings in sync)
        run: bash scripts/check-version.sh

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install gitleaks 8.30.0 (pinned + checksum-verified)
        run: |
          set -euo pipefail
          ver=8.30.0
          base="https://github.com/gitleaks/gitleaks/releases/download/v${ver}"
          asset="gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL -o "$asset" "$base/$asset"
          curl -fsSL -o checksums.txt "$base/gitleaks_${ver}_checksums.txt"
          # Verify the downloaded tarball against the release's signed checksums
          # manifest before executing it.
          awk -v f="$asset" '$2 == f' checksums.txt | sha256sum -c -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree (uses .gitleaks.toml)
        run: gitleaks detect --no-git --source . --redact --no-banner
