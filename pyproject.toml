[project]
name = "lope-agent"
version = "0.10.6"
description = "Multi-CLI validator ensemble for AI work — sprint mode (negotiate/execute/implement/audit), single-shot verbs (ask/review/vote/compare/pipe), natural-language roster management (team), and paste-a-curl onboarding for any AI API. Any AI CLI implements; any AI CLI validates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Sebastian Schkudlara" },
]
keywords = ["ai", "agent", "sprint", "validation", "ensemble", "cli", "claude", "gemini", "codex", "opencode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
# Dev/CI tooling, pinned for reproducibility. Added in the OpenAI-readiness
# sprint (2026-06): ruff is the blocking lint gate; mypy is advisory (D2).
dev = [
    "ruff==0.14.10",
    "mypy==1.10.1",
]

[project.scripts]
lope = "lope.cli:main"

[project.urls]
Homepage = "https://github.com/traylinx/lope"
Repository = "https://github.com/traylinx/lope"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lope"]

[tool.hatch.build.targets.sdist]
include = [
    "lope/",
    "skills/",
    "commands/",
    "scripts/",
    "docs/",
    "install",
    "INSTALL.md",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
# Lint config added in the OpenAI-readiness sprint (2026-06). The select set is
# pinned (ruff's curated default) so a future ruff release can't silently widen
# the gate; expand it (I, B, UP, …) in a follow-up once the backlog is zero and
# held there. `.opencode` is editor tooling, not shipped source.
line-length = 100
target-version = "py39"
extend-exclude = [".opencode", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Advisory, NOT a blocking gate (sprint decision D2). CI runs mypy for signal
# but does not fail on its findings; full typing is scheduled later. Kept
# lenient so it surfaces genuine errors without demanding total annotations.
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
